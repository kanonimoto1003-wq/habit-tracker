<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROGRESS - ハビットトラッカー</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background-color: #111827; color: #fff; }
    #root { width: 100%; min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; border: none; font-weight: bold; transition: all 0.2s; }
    input, select { font-family: inherit; color: white; background-color: #374151; border: 1px solid #4b5563; padding: 0.5rem 1rem; border-radius: 0.5rem; outline: none; width: 100%; margin-bottom: 0.75rem; font-size: 1rem; }
    input:focus, select:focus { border-color: #6b7280; }
    input[type="checkbox"] { width: 24px; height: 24px; margin: 0; accent-color: #22c55e; cursor: pointer; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ===== CHART COMPONENTS =====

    function DonutChart({ data, size = 160 }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
          type: 'doughnut',
          data: { labels: data.map(d => d.name), datasets: [{ data: data.map(d => d.value), backgroundColor: data.map(d => d.color), borderWidth: 0, hoverOffset: 4 }] },
          options: { responsive: false, cutout: '65%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw}` } } } }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [JSON.stringify(data)]);
      return <canvas ref={canvasRef} width={size} height={size} />;
    }

    // 習慣トラッカー: スライド可能折れ線グラフ
    function HabitLineChart({ habits, weekOffset, setWeekOffset }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      const getWeekData = (offset) => {
        // offset=0 → 今週, offset=-1 → 先週, ...
        // 表示は過去7日間をoffsetで動かす
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date();
          d.setDate(d.getDate() + offset * 7 - 6 + i);
          const ds = d.toISOString().split('T')[0];
          const done = habits.filter(h => h.records[ds]).length;
          return { date: ds.slice(5), percentage: habits.length === 0 ? 0 : Math.round((done / habits.length) * 100) };
        });
      };

      const data = getWeekData(weekOffset);
      const avg  = data.length > 0 ? Math.round(data.reduce((s, d) => s + d.percentage, 0) / data.length) : 0;

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
          type: 'line',
          data: {
            labels: data.map(d => d.date),
            datasets: [{
              label: '達成率', data: data.map(d => d.percentage),
              borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.15)',
              fill: true, tension: 0.4, pointBackgroundColor: '#3b82f6', pointRadius: 5
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              y: { min: 0, max: 100, ticks: { color: '#9ca3af', callback: v => v + '%' }, grid: { color: '#374151' } },
              x: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
            },
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.raw}%` } } }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [JSON.stringify(data)]);

      const weekLabel = weekOffset === 0 ? '今週' : `${Math.abs(weekOffset)}週前`;

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <button onClick={() => setWeekOffset(weekOffset - 1)} style={{ background: '#374151', color: '#d1d5db', border: 'none', borderRadius: '0.5rem', padding: '0.4rem 0.75rem', fontWeight: 'bold', cursor: 'pointer' }}>←</button>
              <span style={{ color: '#9ca3af', fontSize: '0.9rem', minWidth: '4rem', textAlign: 'center' }}>{weekLabel}</span>
              <button onClick={() => setWeekOffset(Math.min(0, weekOffset + 1))} disabled={weekOffset >= 0} style={{ background: weekOffset >= 0 ? '#1f2937' : '#374151', color: weekOffset >= 0 ? '#4b5563' : '#d1d5db', border: 'none', borderRadius: '0.5rem', padding: '0.4rem 0.75rem', fontWeight: 'bold', cursor: weekOffset >= 0 ? 'default' : 'pointer' }}>→</button>
            </div>
            <div style={{ textAlign: 'right' }}>
              <span style={{ color: '#9ca3af', fontSize: '0.75rem' }}>平均達成率</span>
              <span style={{ color: '#60a5fa', fontWeight: 900, fontSize: '1.4rem', marginLeft: '0.5rem' }}>{avg}%</span>
            </div>
          </div>
          <div style={{ position: 'relative', height: '220px', width: '100%' }}>
            <canvas ref={canvasRef} />
          </div>
        </div>
      );
    }

    // 目標トラッカー: 週別積み上げ棒グラフ + 折れ線（スライド可）
    function GoalWeekChart({ goals, tag, weekOffset, setWeekOffset }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      // 週の月〜日曜日を返す (weekOffset=0 → 今週, -1 → 先週...)
      const getWeekRange = (offset) => {
        const now = new Date();
        const dayOfWeek = now.getDay(); // 0=Sun
        const monday = new Date(now);
        monday.setDate(now.getDate() - ((dayOfWeek + 6) % 7) + offset * 7);
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          return d.toISOString().split('T')[0];
        });
      };

      // 過去N週分のデータ (offset=0は今週, -1は先週...)
      const numWeeks = 8;
      const weekLabels = [];
      const maxData   = [];
      const moreData  = [];
      const minData   = [];
      const noneData  = [];
      const totalRateData = [];

      const filtered = tag === 'all' ? goals : goals.filter(g => g.tag === tag);

      for (let w = weekOffset - (numWeeks - 1); w <= weekOffset; w++) {
        const dates = getWeekRange(w);
        const monday = dates[0].slice(5); // MM-DD
        weekLabels.push(monday);

        let maxC = 0, moreC = 0, minC = 0;
        const totalSlots = filtered.length * 7;

        dates.forEach(ds => {
          filtered.forEach(goal => {
            const lv = goal.records[ds];
            if (lv === 'max')  maxC++;
            if (lv === 'more') moreC++;
            if (lv === 'min')  minC++;
          });
        });

        const achieved = maxC + moreC + minC;
        const none     = Math.max(0, totalSlots - achieved);
        const maxPct   = totalSlots > 0 ? Math.round(maxC  / totalSlots * 100) : 0;
        const morePct  = totalSlots > 0 ? Math.round(moreC / totalSlots * 100) : 0;
        const minPct   = totalSlots > 0 ? Math.round(minC  / totalSlots * 100) : 0;
        const nonePct  = 100 - maxPct - morePct - minPct;

        maxData.push(maxPct);
        moreData.push(morePct);
        minData.push(minPct);
        noneData.push(nonePct);
        totalRateData.push(maxPct + morePct + minPct);
      }

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
          type: 'bar',
          data: {
            labels: weekLabels,
            datasets: [
              { label: 'MAX',    data: maxData,   backgroundColor: '#16a34a', stack: 'stack' },
              { label: 'MORE',   data: moreData,  backgroundColor: '#2563eb', stack: 'stack' },
              { label: 'MIN',    data: minData,   backgroundColor: '#ea580c', stack: 'stack' },
              { label: '未達成', data: noneData,  backgroundColor: '#374151', stack: 'stack' },
              {
                label: '達成率',
                data: totalRateData,
                type: 'line',
                borderColor: '#facc15',
                backgroundColor: 'transparent',
                borderWidth: 2,
                pointBackgroundColor: '#facc15',
                pointRadius: 4,
                tension: 0.3,
                yAxisID: 'y',
                order: 0
              }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { stacked: true, ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { color: '#2d3748' } },
              y: { stacked: true, min: 0, max: 100, ticks: { color: '#9ca3af', callback: v => v + '%' }, grid: { color: '#374151' } }
            },
            plugins: {
              legend: { display: true, position: 'bottom', labels: { color: '#9ca3af', boxWidth: 12, padding: 16, font: { size: 12 } } },
              tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.raw}%` } }
            }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [JSON.stringify({ weekLabels, maxData, moreData, minData, noneData, totalRateData })]);

      const startLabel = weekOffset - (numWeeks - 1);
      const weekRangeLabel = weekOffset === 0 ? '今週まで' : `${Math.abs(weekOffset)}週前まで`;

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              <button onClick={() => setWeekOffset(weekOffset - 1)} style={{ background: '#374151', color: '#d1d5db', border: 'none', borderRadius: '0.5rem', padding: '0.4rem 0.75rem', fontWeight: 'bold', cursor: 'pointer' }}>←</button>
              <span style={{ color: '#9ca3af', fontSize: '0.85rem', minWidth: '6rem', textAlign: 'center' }}>{weekRangeLabel}</span>
              <button onClick={() => setWeekOffset(Math.min(0, weekOffset + 1))} disabled={weekOffset >= 0} style={{ background: weekOffset >= 0 ? '#1f2937' : '#374151', color: weekOffset >= 0 ? '#4b5563' : '#d1d5db', border: 'none', borderRadius: '0.5rem', padding: '0.4rem 0.75rem', fontWeight: 'bold', cursor: weekOffset >= 0 ? 'default' : 'pointer' }}>→</button>
            </div>
            <span style={{ color: '#6b7280', fontSize: '0.75rem' }}>過去{numWeeks}週間表示</span>
          </div>
          <div style={{ position: 'relative', height: '300px', width: '100%' }}>
            <canvas ref={canvasRef} />
          </div>
        </div>
      );
    }

    // ===== MAIN APP =====
    function HabitTracker() {
      const [mode, setMode] = useState(null);
      const [habits, setHabits] = useState(() => { try { const s = localStorage.getItem('habits'); return s ? JSON.parse(s) : []; } catch { return []; } });
      const [goals,  setGoals]  = useState(() => { try { const s = localStorage.getItem('goals');  return s ? JSON.parse(s) : []; } catch { return []; } });
      const [habitView,  setHabitView]  = useState('record');
      const [goalView,   setGoalView]   = useState('record');
      const [selectedGoalTag,  setSelectedGoalTag]  = useState('all');
      const [selectedDate,     setSelectedDate]     = useState(new Date().toISOString().split('T')[0]);
      const [selectedGoalDate, setSelectedGoalDate] = useState(new Date().toISOString().split('T')[0]);
      const [showHabitForm, setShowHabitForm] = useState(false);
      const [showGoalForm,  setShowGoalForm]  = useState(false);
      const [newHabitName, setNewHabitName] = useState('');
      const [newGoalName,  setNewGoalName]  = useState('');
      const [newGoalTag,   setNewGoalTag]   = useState('');
      const [newGoalMin,   setNewGoalMin]   = useState('');
      const [newGoalMore,  setNewGoalMore]  = useState('');
      const [newGoalMax,   setNewGoalMax]   = useState('');
      const [goalStatsPeriod, setGoalStatsPeriod] = useState('month');
      const [habitWeekOffset, setHabitWeekOffset] = useState(0);
      const [goalWeekOffset,  setGoalWeekOffset]  = useState(0);

      const today = new Date().toISOString().split('T')[0];
      const tags = ['健康', '学習', '仕事', '趣味', '運動'];
      const tagColor = { '健康': '#ea580c', '学習': '#2563eb', '仕事': '#6b7280', '趣味': '#16a34a', '運動': '#f59e0b' };
      const periodLabel = goalStatsPeriod === 'week' ? '過去7日間' : '過去30日間';

      const saveHabits = (u) => { setHabits(u); localStorage.setItem('habits', JSON.stringify(u)); };
      const saveGoals  = (u) => { setGoals(u);  localStorage.setItem('goals',  JSON.stringify(u)); };

      const formatDate = (ds) => new Date(ds + 'T12:00:00').toLocaleString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short', timeZone: 'Asia/Tokyo' });
      const changeDate = (ds, days) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; };

      const addHabit    = () => { if (!newHabitName.trim()) return; saveHabits([...habits, { id: Date.now(), name: newHabitName, records: {} }]); setNewHabitName(''); setShowHabitForm(false); };
      const toggleHabit = (id) => saveHabits(habits.map(h => h.id === id ? { ...h, records: { ...h.records, [selectedDate]: !h.records[selectedDate] } } : h));
      const deleteHabit = (id) => saveHabits(habits.filter(h => h.id !== id));

      const getHabitStats7 = () => habits.map(habit => {
        let done = 0;
        for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); if (habit.records[d.toISOString().split('T')[0]]) done++; }
        return { name: habit.name, achievement: Math.round((done / 7) * 100) };
      });

      const getHabitPieData = () => {
        const done = habits.filter(h => h.records[today]).length;
        return [{ name: '達成', value: done, color: '#22c55e' }, { name: '未達成', value: habits.length - done, color: '#4b5563' }];
      };

      const addGoal    = () => { if (!newGoalName.trim() || !newGoalMin || !newGoalMore || !newGoalMax) return; saveGoals([...goals, { id: Date.now(), name: newGoalName, tag: newGoalTag || (selectedGoalTag !== 'all' ? selectedGoalTag : '健康'), min: newGoalMin, more: newGoalMore, max: newGoalMax, records: {} }]); setNewGoalName(''); setNewGoalMin(''); setNewGoalMore(''); setNewGoalMax(''); setNewGoalTag(''); setShowGoalForm(false); };
      const recordGoal = (id, level) => saveGoals(goals.map(g => g.id === id ? { ...g, records: { ...g.records, [selectedGoalDate]: g.records[selectedGoalDate] === level ? null : level } } : g));
      const deleteGoal = (id) => saveGoals(goals.filter(g => g.id !== id));

      const getGoalStats = (tag = 'all') => {
        const days = goalStatsPeriod === 'week' ? 7 : 30;
        const filtered = tag === 'all' ? goals : goals.filter(g => g.tag === tag);
        return filtered.map(goal => {
          let min = 0, more = 0, max = 0;
          for (let i = days - 1; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i);
            const lv = goal.records[d.toISOString().split('T')[0]];
            if (lv === 'min') min++; if (lv === 'more') more++; if (lv === 'max') max++;
          }
          const total = min + more + max;
          return {
            name: goal.name, tag: goal.tag,
            minCount: min, moreCount: more, maxCount: max, totalAchieved: total, totalDays: days,
            achievement: Math.round((total / days) * 100),
            pieData: [
              { name: 'MAX',   value: max,                        color: '#16a34a' },
              { name: 'MORE',  value: more,                       color: '#2563eb' },
              { name: 'MIN',   value: min,                        color: '#ea580c' },
              { name: '未達成', value: Math.max(0, days - total), color: '#4b5563' }
            ]
          };
        });
      };

      const getOverallData = (tag = 'all') => {
        const stats = getGoalStats(tag);
        let maxT = 0, moreT = 0, minT = 0, days = 0;
        stats.forEach(s => { maxT += s.maxCount; moreT += s.moreCount; minT += s.minCount; days += s.totalDays; });
        const total = maxT + moreT + minT;
        const maxPct  = days > 0 ? Math.round(maxT  / days * 100) : 0;
        const morePct = days > 0 ? Math.round(moreT / days * 100) : 0;
        const minPct  = days > 0 ? Math.round(minT  / days * 100) : 0;
        return {
          pieData: [
            { name: 'MAX',   value: maxT,                             color: '#16a34a' },
            { name: 'MORE',  value: moreT,                            color: '#2563eb' },
            { name: 'MIN',   value: minT,                             color: '#ea580c' },
            { name: '未達成', value: Math.max(0, days - total),       color: '#4b5563' }
          ],
          maxT, moreT, minT, days, maxPct, morePct, minPct
        };
      };

      const card    = { backgroundColor: '#1f2937', borderRadius: '0.75rem', padding: '1.5rem', border: '1px solid #374151' };
      const btnBase = { borderRadius: '0.5rem', fontWeight: 'bold', color: 'white', padding: '0.75rem 1.5rem', border: 'none' };

      // ---- HOME ----
      if (!mode) return (
        <div style={{ minHeight: '100vh', backgroundColor: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: 0, right: 0, width: 320, height: 320, background: '#2563eb', borderRadius: '50%', filter: 'blur(80px)', opacity: 0.12 }} />
          <div style={{ position: 'absolute', bottom: 0, left: 0, width: 320, height: 320, background: '#ea580c', borderRadius: '50%', filter: 'blur(80px)', opacity: 0.12 }} />
          <div style={{ ...card, position: 'relative', zIndex: 10, maxWidth: '28rem', width: '100%', padding: '3rem', boxShadow: '0 25px 50px rgba(0,0,0,0.5)' }}>
            <div style={{ textAlign: 'center', marginBottom: '2.5rem' }}>
              <h1 style={{ fontSize: 'clamp(2.5rem, 10vw, 4rem)', fontWeight: 900, letterSpacing: '-0.05em', background: 'linear-gradient(to right, #60a5fa, #fb923c, #4ade80)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>PROGRESS</h1>
              <p style={{ color: '#9ca3af', marginTop: '0.5rem' }}>毎日の成長を追跡する</p>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              <button onClick={() => { setMode('habits'); setHabitView('record'); setSelectedDate(today); }} style={{ ...btnBase, background: 'linear-gradient(to right,#2563eb,#1d4ed8)', border: '1px solid #3b82f6', padding: '1.25rem' }}>
                <div style={{ fontSize: '2rem' }}>📋</div><div>習慣トラッカー</div>
                <div style={{ fontWeight: 'normal', fontSize: '0.875rem', opacity: 0.85, marginTop: '0.25rem' }}>日々の習慣を記録</div>
              </button>
              <button onClick={() => { setMode('goals'); setGoalView('record'); setSelectedGoalTag('all'); setSelectedGoalDate(today); }} style={{ ...btnBase, background: 'linear-gradient(to right,#ea580c,#c2410c)', border: '1px solid #f97316', padding: '1.25rem' }}>
                <div style={{ fontSize: '2rem' }}>🎯</div><div>目標トラッカー</div>
                <div style={{ fontWeight: 'normal', fontSize: '0.875rem', opacity: 0.85, marginTop: '0.25rem' }}>レベル別目標を追跡</div>
              </button>
            </div>
          </div>
        </div>
      );

      // ---- HABITS ----
      if (mode === 'habits') return (
        <div style={{ minHeight: '100vh', backgroundColor: '#111827', padding: '1rem' }}>
          <div style={{ maxWidth: '56rem', margin: '0 auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem' }}>
              <button onClick={() => setMode(null)} style={{ ...btnBase, background: '#374151', padding: '0.5rem 1rem' }}>←</button>
              <h1 style={{ fontSize: '1.875rem', fontWeight: 900 }}>習慣トラッカー</h1>
            </div>
            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem' }}>
              {['record','dashboard'].map(v => (
                <button key={v} onClick={() => setHabitView(v)} style={{ ...btnBase, background: habitView === v ? '#2563eb' : '#374151', padding: '0.6rem 1.25rem' }}>
                  {v === 'record' ? '記録' : '📊 分析'}
                </button>
              ))}
            </div>

            {habitView === 'record' ? (
              <>
                <div style={{ ...card, display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem', padding: '0.75rem 1rem' }}>
                  <button onClick={() => setSelectedDate(changeDate(selectedDate, -1))} style={{ ...btnBase, background: '#374151', padding: '0.6rem 1rem' }}>←</button>
                  <p style={{ flex: 1, textAlign: 'center', fontWeight: 'bold', fontSize: '1.125rem' }}>{formatDate(selectedDate)}</p>
                  <button onClick={() => setSelectedDate(changeDate(selectedDate, 1))} style={{ ...btnBase, background: '#374151', padding: '0.6rem 1rem' }}>→</button>
                </div>
                <div style={{ ...card, marginBottom: '1.5rem' }}>
                  {habits.length === 0
                    ? <p style={{ color: '#9ca3af', textAlign: 'center', padding: '2rem' }}>習慣がまだ登録されていません</p>
                    : <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                        {habits.map(h => (
                          <div key={h.id} style={{ backgroundColor: '#374151', borderRadius: '0.5rem', padding: '0.875rem 1rem', display: 'flex', alignItems: 'center', gap: '1rem', border: '1px solid #4b5563' }}>
                            <input type="checkbox" checked={!!h.records[selectedDate]} onChange={() => toggleHabit(h.id)} />
                            <span style={{ flex: 1, color: h.records[selectedDate] ? '#6b7280' : '#f3f4f6', textDecoration: h.records[selectedDate] ? 'line-through' : 'none' }}>{h.name}</span>
                            <button onClick={() => deleteHabit(h.id)} style={{ background: 'transparent', color: '#ef4444', fontSize: '1.25rem', padding: '0 0.25rem' }}>✕</button>
                          </div>
                        ))}
                      </div>
                  }
                </div>
                {!showHabitForm
                  ? <button onClick={() => setShowHabitForm(true)} style={{ ...btnBase, background: '#374151', border: '1px solid #4b5563', width: '100%', padding: '0.875rem' }}>＋ 習慣を追加</button>
                  : <div style={card}>
                      <h2 style={{ fontWeight: 'bold', marginBottom: '1rem' }}>新しい習慣を追加</h2>
                      <input type="text" placeholder="習慣の名前" value={newHabitName} onChange={e => setNewHabitName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addHabit()} />
                      <div style={{ display: 'flex', gap: '0.5rem' }}>
                        <button onClick={addHabit} style={{ ...btnBase, flex: 1, background: '#2563eb' }}>追加</button>
                        <button onClick={() => setShowHabitForm(false)} style={{ ...btnBase, flex: 1, background: '#4b5563' }}>キャンセル</button>
                      </div>
                    </div>
                }
              </>
            ) : (
              <>
                {/* Stats cards */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '1rem', marginBottom: '1.5rem' }}>
                  {[
                    { label: '本日の達成率', value: habits.length === 0 ? '0%' : Math.round((habits.filter(h => h.records[today]).length / habits.length) * 100) + '%', color: '#60a5fa' },
                    { label: '登録習慣数',   value: habits.length + '個', color: '#fb923c' },
                    { label: '総記録日数',   value: [...new Set(habits.flatMap(h => Object.keys(h.records).filter(k => h.records[k])))].length + '日', color: '#4ade80' }
                  ].map(s => (
                    <div key={s.label} style={card}>
                      <p style={{ color: '#9ca3af', fontSize: '0.75rem', marginBottom: '0.5rem' }}>{s.label}</p>
                      <p style={{ fontSize: '1.75rem', fontWeight: 900, color: s.color }}>{s.value}</p>
                    </div>
                  ))}
                </div>

                {habits.length > 0 && (
                  <>
                    {/* 本日の達成状況 */}
                    <div style={{ ...card, marginBottom: '1.5rem' }}>
                      <h2 style={{ fontWeight: 'bold', marginBottom: '1.25rem' }}>本日の達成状況</h2>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '2rem', flexWrap: 'wrap' }}>
                        <DonutChart data={getHabitPieData()} size={160} />
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                          {getHabitPieData().map(d => (
                            <div key={d.name} style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                              <div style={{ width: 14, height: 14, borderRadius: 3, backgroundColor: d.color }} />
                              <span style={{ color: '#d1d5db' }}>{d.name}: <strong style={{ color: 'white' }}>{d.value}個</strong></span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* 達成率推移（スライド可） */}
                    <div style={{ ...card, marginBottom: '1.5rem' }}>
                      <h2 style={{ fontWeight: 'bold', marginBottom: '1rem' }}>達成率推移</h2>
                      <HabitLineChart habits={habits} weekOffset={habitWeekOffset} setWeekOffset={setHabitWeekOffset} />
                    </div>

                    {/* 習慣ごとの達成率 */}
                    <div style={card}>
                      <h2 style={{ fontWeight: 'bold', marginBottom: '1.25rem' }}>習慣ごとの達成率（直近7日間）</h2>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                        {getHabitStats7().map((s, i) => (
                          <div key={i} style={{ backgroundColor: '#374151', borderRadius: '0.5rem', padding: '0.875rem 1rem' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                              <span style={{ color: '#f3f4f6', fontWeight: 600 }}>{s.name}</span>
                              <span style={{ color: '#60a5fa', fontWeight: 'bold' }}>{s.achievement}%</span>
                            </div>
                            <div style={{ backgroundColor: '#4b5563', borderRadius: 9999, height: 8 }}>
                              <div style={{ backgroundColor: '#3b82f6', height: 8, borderRadius: 9999, width: s.achievement + '%', transition: 'width 0.5s' }} />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}
              </>
            )}
          </div>
        </div>
      );

      // ---- GOALS ----
      if (mode === 'goals') {
        const filteredGoals = selectedGoalTag === 'all' ? goals : goals.filter(g => g.tag === selectedGoalTag);
        const overall = getOverallData(selectedGoalTag);

        return (
          <div style={{ minHeight: '100vh', backgroundColor: '#111827', padding: '1rem' }}>
            <div style={{ maxWidth: '64rem', margin: '0 auto' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem' }}>
                <button onClick={() => setMode(null)} style={{ ...btnBase, background: '#374151', padding: '0.5rem 1rem' }}>←</button>
                <h1 style={{ fontSize: '1.875rem', fontWeight: 900 }}>目標トラッカー</h1>
              </div>
              <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem' }}>
                {['record','dashboard'].map(v => (
                  <button key={v} onClick={() => setGoalView(v)} style={{ ...btnBase, background: goalView === v ? '#ea580c' : '#374151', padding: '0.6rem 1.25rem' }}>
                    {v === 'record' ? '記録' : '📊 分析'}
                  </button>
                ))}
              </div>

              {goalView === 'record' ? (
                <>
                  <div style={{ ...card, display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem', padding: '0.75rem 1rem' }}>
                    <button onClick={() => setSelectedGoalDate(changeDate(selectedGoalDate, -1))} style={{ ...btnBase, background: '#374151', padding: '0.6rem 1rem' }}>←</button>
                    <p style={{ flex: 1, textAlign: 'center', fontWeight: 'bold', fontSize: '1.125rem' }}>{formatDate(selectedGoalDate)}</p>
                    <button onClick={() => setSelectedGoalDate(changeDate(selectedGoalDate, 1))} style={{ ...btnBase, background: '#374151', padding: '0.6rem 1rem' }}>→</button>
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem', overflowX: 'auto', marginBottom: '1.5rem', paddingBottom: '0.25rem' }}>
                    <button onClick={() => setSelectedGoalTag('all')} style={{ ...btnBase, background: selectedGoalTag === 'all' ? '#374151' : '#1f2937', border: '1px solid #374151', padding: '0.5rem 1rem', whiteSpace: 'nowrap' }}>全て</button>
                    {tags.map(t => (
                      <button key={t} onClick={() => setSelectedGoalTag(t)} style={{ ...btnBase, background: selectedGoalTag === t ? tagColor[t] || '#6b7280' : '#1f2937', border: '1px solid #374151', padding: '0.5rem 1rem', whiteSpace: 'nowrap' }}>{t}</button>
                    ))}
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', marginBottom: '1.5rem' }}>
                    {filteredGoals.length === 0
                      ? <div style={{ ...card, textAlign: 'center', color: '#9ca3af', padding: '3rem' }}>このカテゴリに目標がありません</div>
                      : filteredGoals.map(goal => (
                          <div key={goal.id} style={card}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                <h3 style={{ fontWeight: 'bold', fontSize: '1.125rem' }}>{goal.name}</h3>
                                <span style={{ backgroundColor: tagColor[goal.tag] || '#6b7280', color: 'white', padding: '0.2rem 0.6rem', borderRadius: 9999, fontSize: '0.75rem', fontWeight: 'bold' }}>{goal.tag}</span>
                              </div>
                              <button onClick={() => deleteGoal(goal.id)} style={{ background: 'transparent', color: '#ef4444', fontSize: '1.25rem' }}>✕</button>
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '0.75rem' }}>
                              {[
                                { level: 'min',  label: 'MIN',  val: goal.min,  active: '#ea580c', activeBorder: '#f97316' },
                                { level: 'more', label: 'MORE', val: goal.more, active: '#2563eb', activeBorder: '#3b82f6' },
                                { level: 'max',  label: 'MAX',  val: goal.max,  active: '#16a34a', activeBorder: '#22c55e' }
                              ].map(b => {
                                const isActive = goal.records[selectedGoalDate] === b.level;
                                return (
                                  <button key={b.level} onClick={() => recordGoal(goal.id, b.level)} style={{ ...btnBase, padding: '0.875rem 0.5rem', background: isActive ? b.active : '#374151', border: '1px solid ' + (isActive ? b.activeBorder : '#4b5563'), lineHeight: 1.4 }}>
                                    {b.label}<br /><span style={{ fontSize: '0.75rem', fontWeight: 'normal', opacity: 0.9 }}>{b.val}</span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))
                    }
                  </div>
                  {!showGoalForm
                    ? <button onClick={() => setShowGoalForm(true)} style={{ ...btnBase, background: '#374151', border: '1px solid #4b5563', width: '100%', padding: '0.875rem' }}>＋ 目標を追加</button>
                    : <div style={card}>
                        <h2 style={{ fontWeight: 'bold', marginBottom: '1rem' }}>新しい目標を追加</h2>
                        <input type="text" placeholder="目標名" value={newGoalName} onChange={e => setNewGoalName(e.target.value)} />
                        {selectedGoalTag === 'all' && (
                          <select value={newGoalTag} onChange={e => setNewGoalTag(e.target.value)}>
                            <option value="">カテゴリを選択</option>
                            {tags.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        )}
                        <input type="text" placeholder="MIN（最低目標）" value={newGoalMin} onChange={e => setNewGoalMin(e.target.value)} />
                        <input type="text" placeholder="MORE（頑張り目標）" value={newGoalMore} onChange={e => setNewGoalMore(e.target.value)} />
                        <input type="text" placeholder="MAX（最高目標）" value={newGoalMax} onChange={e => setNewGoalMax(e.target.value)} />
                        <div style={{ display: 'flex', gap: '0.5rem' }}>
                          <button onClick={addGoal} style={{ ...btnBase, flex: 1, background: '#ea580c' }}>追加</button>
                          <button onClick={() => setShowGoalForm(false)} style={{ ...btnBase, flex: 1, background: '#4b5563' }}>キャンセル</button>
                        </div>
                      </div>
                  }
                </>
              ) : (
                <>
                  {/* Tag tabs */}
                  <div style={{ display: 'flex', gap: 0, overflowX: 'auto', marginBottom: '1.5rem', borderBottom: '1px solid #374151' }}>
                    {['all', ...tags].map(t => (
                      <button key={t} onClick={() => setSelectedGoalTag(t)} style={{ background: 'transparent', color: selectedGoalTag === t ? 'white' : '#6b7280', fontWeight: selectedGoalTag === t ? 'bold' : 'normal', padding: '0.6rem 1rem', borderBottom: '2px solid ' + (selectedGoalTag === t ? 'white' : 'transparent'), borderRadius: 0, whiteSpace: 'nowrap' }}>
                        {t === 'all' ? '全て' : t}
                      </button>
                    ))}
                  </div>

                  {/* Period selector */}
                  <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem' }}>
                    {[['week','過去7日間'],['month','過去30日間']].map(([v, l]) => (
                      <button key={v} onClick={() => setGoalStatsPeriod(v)} style={{ ...btnBase, background: goalStatsPeriod === v ? '#ea580c' : '#374151', padding: '0.5rem 1.25rem' }}>{l}</button>
                    ))}
                  </div>

                  {goals.length > 0 && (
                    <>
                      {/* ① 総合成果グラフ */}
                      <div style={{ ...card, marginBottom: '1.5rem' }}>
                        <h2 style={{ fontWeight: 'bold', marginBottom: '0.25rem' }}>
                          総合成果（{goalStatsPeriod === 'week' ? '過去7日間' : '過去30日間'}）
                        </h2>
                        <p style={{ color: '#9ca3af', fontSize: '0.8rem', marginBottom: '1.25rem' }}>期間全体の日数に対するレベル別達成割合</p>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '2rem', flexWrap: 'wrap' }}>
                          <div style={{ flexShrink: 0 }}>
                            <DonutChart data={overall.pieData} size={180} />
                          </div>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', flex: 1, minWidth: '150px' }}>
                            {[
                              { label: 'MAX達成',  color: '#16a34a', count: overall.maxT,  pct: overall.maxPct  },
                              { label: 'MORE達成', color: '#2563eb', count: overall.moreT, pct: overall.morePct },
                              { label: 'MIN達成',  color: '#ea580c', count: overall.minT,  pct: overall.minPct  }
                            ].map(({ label, color, count, pct }) => (
                              <div key={label} style={{ backgroundColor: '#374151', borderRadius: '0.5rem', padding: '0.75rem 1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                  <div style={{ width: 12, height: 12, borderRadius: 3, backgroundColor: color }} />
                                  <span style={{ color: '#d1d5db', fontSize: '0.875rem' }}>{label}</span>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                  <span style={{ color, fontWeight: 900, fontSize: '1.1rem' }}>{count}回</span>
                                  <span style={{ color: '#9ca3af', fontSize: '0.8rem', marginLeft: '0.4rem' }}>({pct}%)</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* ② 週別推移グラフ（スライド可） */}
                      <div style={{ ...card, marginBottom: '1.5rem' }}>
                        <h2 style={{ fontWeight: 'bold', marginBottom: '0.25rem' }}>週別達成率推移</h2>
                        <p style={{ color: '#9ca3af', fontSize: '0.8rem', marginBottom: '1rem' }}>月〜日曜日を1週とした積み上げ棒グラフ・黄色折れ線は合計達成率</p>
                        <GoalWeekChart goals={goals} tag={selectedGoalTag} weekOffset={goalWeekOffset} setWeekOffset={setGoalWeekOffset} />
                      </div>
                    </>
                  )}

                  {/* ③ 目標ごとのグラフ */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                    {getGoalStats(selectedGoalTag).length === 0
                      ? <div style={{ ...card, textAlign: 'center', color: '#9ca3af', padding: '3rem' }}>このカテゴリに目標がありません</div>
                      : getGoalStats(selectedGoalTag).map((stat, i) => (
                          <div key={i} style={card}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.25rem' }}>
                              <h3 style={{ fontWeight: 'bold', fontSize: '1.125rem', paddingTop: '0.3rem' }}>{stat.name}</h3>
                              <div style={{ textAlign: 'right' }}>
                                <p style={{ color: '#9ca3af', fontSize: '0.7rem', marginBottom: '0.1rem' }}>達成率（{periodLabel}）</p>
                                <span style={{ color: '#fb923c', fontWeight: 900, fontSize: '1.5rem' }}>{stat.achievement}%</span>
                              </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '2rem', flexWrap: 'wrap' }}>
                              <div style={{ flexShrink: 0 }}>
                                <DonutChart data={stat.pieData} size={140} />
                              </div>
                              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                {[
                                  { label: 'MAX',   count: stat.maxCount,  color: '#16a34a' },
                                  { label: 'MORE',  count: stat.moreCount, color: '#2563eb' },
                                  { label: 'MIN',   count: stat.minCount,  color: '#ea580c' },
                                  { label: '未達成', count: Math.max(0, stat.totalDays - stat.totalAchieved), color: '#4b5563' }
                                ].map(d => (
                                  <div key={d.label} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <div style={{ width: 12, height: 12, borderRadius: 3, backgroundColor: d.color, flexShrink: 0 }} />
                                    <span style={{ color: '#9ca3af', fontSize: '0.875rem' }}>{d.label}: <strong style={{ color: 'white' }}>{d.count}日</strong></span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          </div>
                        ))
                    }
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HabitTracker />);
  </script>
</body>
</html>
