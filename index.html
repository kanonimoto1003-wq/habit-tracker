<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROGRESS - ハビットトラッカー</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto'; background-color: #111827; color: #fff; }
    #root { width: 100%; min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; border: none; font-weight: bold; transition: all 0.2s; }
    input, select { font-family: inherit; color: white; background-color: #374151; border: 1px solid #4b5563; padding: 0.5rem 1rem; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    
    function HabitTracker() {
      const [mode, setMode] = useState(null);
      const [habits, setHabits] = useState(() => {
        try { const saved = localStorage.getItem('habits'); return saved ? JSON.parse(saved) : []; } catch { return []; }
      });
      const [goals, setGoals] = useState(() => {
        try { const saved = localStorage.getItem('goals'); return saved ? JSON.parse(saved) : []; } catch { return []; }
      });
      const [habitView, setHabitView] = useState('record');
      const [goalView, setGoalView] = useState('record');
      const [selectedGoalTag, setSelectedGoalTag] = useState('all');
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedGoalDate, setSelectedGoalDate] = useState(new Date().toISOString().split('T')[0]);
      const [showHabitForm, setShowHabitForm] = useState(false);
      const [showGoalForm, setShowGoalForm] = useState(false);
      const [newHabitName, setNewHabitName] = useState('');
      const [newGoalName, setNewGoalName] = useState('');
      const [newGoalTag, setNewGoalTag] = useState('');
      const [newGoalMin, setNewGoalMin] = useState('');
      const [newGoalMore, setNewGoalMore] = useState('');
      const [newGoalMax, setNewGoalMax] = useState('');
      const [goalStatsPeriod, setGoalStatsPeriod] = useState('month');

      const today = new Date().toISOString().split('T')[0];
      const tags = ['健康', '学習', '仕事', '趣味', '運動'];

      const formatDate = (dateStr) => {
        const date = new Date(dateStr + 'T12:00:00');
        return date.toLocaleString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short', timeZone: 'Asia/Tokyo' });
      };

      const changeDate = (dateStr, days) => {
        const date = new Date(dateStr + 'T12:00:00');
        date.setDate(date.getDate() + days);
        return date.toISOString().split('T')[0];
      };

      const addHabit = () => {
        if (newHabitName.trim()) {
          const updated = [...habits, { id: Date.now(), name: newHabitName, records: {} }];
          setHabits(updated);
          localStorage.setItem('habits', JSON.stringify(updated));
          setNewHabitName('');
          setShowHabitForm(false);
        }
      };

      const toggleHabit = (habitId) => {
        const updated = habits.map(h => 
          h.id === habitId ? { ...h, records: { ...h.records, [selectedDate]: !h.records[selectedDate] } } : h
        );
        setHabits(updated);
        localStorage.setItem('habits', JSON.stringify(updated));
      };

      const deleteHabit = (habitId) => {
        const updated = habits.filter(h => h.id !== habitId);
        setHabits(updated);
        localStorage.setItem('habits', JSON.stringify(updated));
      };

      const addGoal = () => {
        if (newGoalName.trim() && newGoalMin && newGoalMore && newGoalMax) {
          const updated = [...goals, {
            id: Date.now(),
            name: newGoalName,
            tag: newGoalTag || selectedGoalTag,
            min: newGoalMin,
            more: newGoalMore,
            max: newGoalMax,
            records: {}
          }];
          setGoals(updated);
          localStorage.setItem('goals', JSON.stringify(updated));
          setNewGoalName('');
          setNewGoalMin('');
          setNewGoalMore('');
          setNewGoalMax('');
          setShowGoalForm(false);
        }
      };

      const recordGoal = (goalId, level) => {
        const updated = goals.map(g =>
          g.id === goalId ? { ...g, records: { ...g.records, [selectedGoalDate]: level } } : g
        );
        setGoals(updated);
        localStorage.setItem('goals', JSON.stringify(updated));
      };

      const deleteGoal = (goalId) => {
        const updated = goals.filter(g => g.id !== goalId);
        setGoals(updated);
        localStorage.setItem('goals', JSON.stringify(updated));
      };

      const getHabitStats = () => {
        return habits.map(habit => {
          let completed = 0;
          for (let i = 6; i >= 0; i--) {
            const date = new Date();
            date.setDate(date.getDate() - i);
            const dateStr = date.toISOString().split('T')[0];
            if (habit.records[dateStr]) completed++;
          }
          return { name: habit.name, achievement: Math.round((completed / 7) * 100) };
        });
      };

      const getGoalStatsForPeriod = () => {
        const days = goalStatsPeriod === 'week' ? 7 : 30;
        return goals.map(goal => {
          let minCount = 0, moreCount = 0, maxCount = 0;
          for (let i = days - 1; i >= 0; i--) {
            const date = new Date();
            date.setDate(date.getDate() - i);
            const dateStr = date.toISOString().split('T')[0];
            const level = goal.records[dateStr];
            if (level === 'min') minCount++;
            if (level === 'more') moreCount++;
            if (level === 'max') maxCount++;
          }
          const totalAchieved = minCount + moreCount + maxCount;
          return {
            name: goal.name,
            tag: goal.tag,
            minCount,
            moreCount,
            maxCount,
            totalAchieved,
            achievement: Math.round((totalAchieved / days) * 100)
          };
        });
      };

      if (!mode) {
        return (
          <div style={{minHeight: '100vh', backgroundColor: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem', position: 'relative', overflow: 'hidden'}}>
            <div style={{position: 'absolute', top: 0, right: 0, width: '320px', height: '320px', background: '#2563eb', borderRadius: '50%', mixBlendMode: 'multiply', filter: 'blur(64px)', opacity: 0.1}}></div>
            <div style={{position: 'absolute', bottom: 0, left: 0, width: '320px', height: '320px', background: '#ea580c', borderRadius: '50%', mixBlendMode: 'multiply', filter: 'blur(64px)', opacity: 0.1}}></div>
            
            <div style={{position: 'relative', zIndex: 10, backgroundColor: '#111827', borderRadius: '1rem', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)', padding: '3rem', maxWidth: '28rem', width: '100%', border: '1px solid #1f2937'}}>
              <div style={{textAlign: 'center', marginBottom: '3rem'}}>
                <h1 style={{fontSize: 'clamp(2rem, 8vw, 3.75rem)', fontWeight: 900, marginBottom: '1rem', letterSpacing: '-0.05em', background: 'linear-gradient(to right, #60a5fa, #fb923c, #4ade80)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text'}}>
                  PROGRESS
                </h1>
                <p style={{color: '#9ca3af', fontSize: '1.125rem'}}>毎日の成長を追跡する</p>
              </div>
              
              <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                <button
                  onClick={() => { setMode('habits'); setHabitView('record'); }}
                  style={{background: 'linear-gradient(to right, #2563eb, #1d4ed8)', color: 'white', padding: '1rem 1.5rem', borderRadius: '0.75rem', border: '1px solid #3b82f6', fontWeight: 'bold'}}
                >
                  📋 習慣トラッカー
                  <p style={{fontSize: '0.875rem', fontWeight: 'normal', marginTop: '0.5rem', opacity: 0.9}}>日々の習慣を記録</p>
                </button>
                
                <button
                  onClick={() => { setMode('goals'); setGoalView('record'); }}
                  style={{background: 'linear-gradient(to right, #ea580c, #c2410c)', color: 'white', padding: '1rem 1.5rem', borderRadius: '0.75rem', border: '1px solid #f97316', fontWeight: 'bold'}}
                >
                  🎯 目標トラッカー
                  <p style={{fontSize: '0.875rem', fontWeight: 'normal', marginTop: '0.5rem', opacity: 0.9}}>レベル別目標を追跡</p>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (mode === 'habits') {
        return (
          <div style={{minHeight: '100vh', backgroundColor: '#111827', padding: '1rem'}}>
            <div style={{maxWidth: '56rem', margin: '0 auto'}}>
              <div style={{display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem'}}>
                <button onClick={() => setMode(null)} style={{padding: '0.5rem', color: '#d1d5db', background: 'transparent'}}>←</button>
                <h1 style={{fontSize: '1.875rem', fontWeight: 'bold', color: 'white'}}>習慣トラッカー</h1>
              </div>

              <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1.5rem'}}>
                <button onClick={() => setHabitView('record')} style={{padding: '0.75rem 1.5rem', borderRadius: '0.5rem', fontWeight: 'bold', background: habitView === 'record' ? '#2563eb' : '#374151', color: 'white'}}>記録</button>
                <button onClick={() => setHabitView('dashboard')} style={{padding: '0.75rem 1.5rem', borderRadius: '0.5rem', fontWeight: 'bold', background: habitView === 'dashboard' ? '#2563eb' : '#374151', color: 'white'}}>📊 分析</button>
              </div>

              {habitView === 'record' ? (
                <>
                  <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1rem', marginBottom: '1.5rem', border: '1px solid #374151', display: 'flex', alignItems: 'center', justifyContent: 'space-between'}}>
                    <button onClick={() => setSelectedDate(changeDate(selectedDate, -1))} style={{padding: '0.75rem', background: '#374151', borderRadius: '0.5rem', color: '#d1d5db', width: '48px', height: '48px'}}>←</button>
                    <p style={{fontSize: '1.25rem', fontWeight: 'bold', color: 'white', flex: 1, textAlign: 'center'}}>{formatDate(selectedDate)}</p>
                    <button onClick={() => setSelectedDate(changeDate(selectedDate, 1))} style={{padding: '0.75rem', background: '#374151', borderRadius: '0.5rem', color: '#d1d5db', width: '48px', height: '48px'}}>→</button>
                  </div>

                  <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1.5rem', marginBottom: '1.5rem', border: '1px solid #374151'}}>
                    <h2 style={{fontSize: '1.125rem', fontWeight: 'bold', color: 'white', marginBottom: '1rem'}}>{formatDate(selectedDate)}</h2>
                    {habits.length === 0 ? (
                      <p style={{color: '#9ca3af', textAlign: 'center', padding: '1.5rem'}}>習慣がまだ登録されていません</p>
                    ) : (
                      <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem'}}>
                        {habits.map(habit => (
                          <div key={habit.id} style={{backgroundColor: '#374151', borderRadius: '0.5rem', padding: '1rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between'}}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '1rem', flex: 1}}>
                              <input type="checkbox" checked={!!habit.records[selectedDate]} onChange={() => toggleHabit(habit.id)} style={{width: '24px', height: '24px'}} />
                              <span style={{color: habit.records[selectedDate] ? '#6b7280' : '#f3f4f6', textDecoration: habit.records[selectedDate] ? 'line-through' : 'none'}}>{habit.name}</span>
                            </div>
                            <button onClick={() => deleteHabit(habit.id)} style={{background: 'transparent', color: '#ef4444', fontSize: '1.25rem'}}>✕</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {!showHabitForm ? (
                    <button onClick={() => setShowHabitForm(true)} style={{width: '100%', background: '#374151', color: 'white', fontWeight: 'bold', padding: '0.75rem', borderRadius: '0.5rem', border: '1px solid #4b5563'}}>➕ 習慣を追加</button>
                  ) : (
                    <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1.5rem', border: '1px solid #374151'}}>
                      <input type="text" placeholder="習慣の名前" value={newHabitName} onChange={(e) => setNewHabitName(e.target.value)} style={{width: '100%', marginBottom: '0.75rem'}} />
                      <div style={{display: 'flex', gap: '0.5rem'}}>
                        <button onClick={addHabit} style={{flex: 1, background: '#2563eb', color: 'white', padding: '0.5rem'}}>追加</button>
                        <button onClick={() => setShowHabitForm(false)} style={{flex: 1, background: '#4b5563', color: 'white', padding: '0.5rem'}}>キャンセル</button>
                      </div>
                    </div>
                  )}
                </>
              ) : (
                <>
                  <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem', marginBottom: '1.5rem'}}>
                    <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1rem', border: '1px solid #374151'}}>
                      <p style={{color: '#9ca3af', fontSize: '0.875rem'}}>本日の達成率</p>
                      <p style={{fontSize: '1.875rem', fontWeight: 'bold', color: '#60a5fa'}}>{habits.length === 0 ? 0 : Math.round((habits.filter(h => h.records[today]).length / habits.length) * 100)}%</p>
                    </div>
                    <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1rem', border: '1px solid #374151'}}>
                      <p style={{color: '#9ca3af', fontSize: '0.875rem'}}>登録習慣数</p>
                      <p style={{fontSize: '1.875rem', fontWeight: 'bold', color: '#fb923c'}}>{habits.length}</p>
                    </div>
                    <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1rem', border: '1px solid #374151'}}>
                      <p style={{color: '#9ca3af', fontSize: '0.875rem'}}>完了日数</p>
                      <p style={{fontSize: '1.875rem', fontWeight: 'bold', color: '#4ade80'}}>{habits.reduce((sum, h) => sum + Object.keys(h.records).length, 0)}</p>
                    </div>
                  </div>

                  {habits.length > 0 && (
                    <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1.5rem', border: '1px solid #374151'}}>
                      <h2 style={{fontSize: '1.125rem', fontWeight: 'bold', color: 'white', marginBottom: '1rem'}}>習慣ごとの達成率（7日間）</h2>
                      {getHabitStats().map((stat, idx) => (
                        <div key={idx} style={{display: 'flex', alignItems: 'center', gap: '1rem', backgroundColor: '#374151', padding: '1rem', borderRadius: '0.5rem', marginBottom: '0.75rem'}}>
                          <span style={{flex: 1, overflow: 'hidden', textOverflow: 'ellipsis'}}>{stat.name}</span>
                          <div style={{width: '100px', backgroundColor: '#4b5563', borderRadius: '9999px', height: '8px'}}>
                            <div style={{backgroundColor: '#3b82f6', height: '8px', borderRadius: '9999px', width: `${stat.achievement}%`}}></div>
                          </div>
                          <span style={{fontWeight: 'bold', color: '#60a5fa', width: '40px', textAlign: 'right'}}>{stat.achievement}%</span>
                        </div>
                      ))}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        );
      }

      if (mode === 'goals') {
        return (
          <div style={{minHeight: '100vh', backgroundColor: '#111827', padding: '1rem'}}>
            <div style={{maxWidth: '64rem', margin: '0 auto'}}>
              <div style={{display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.5rem'}}>
                <button onClick={() => setMode(null)} style={{padding: '0.5rem', color: '#d1d5db', background: 'transparent'}}>←</button>
                <h1 style={{fontSize: '1.875rem', fontWeight: 'bold', color: 'white'}}>目標トラッカー</h1>
              </div>

              <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1.5rem'}}>
                <button onClick={() => setGoalView('record')} style={{padding: '0.75rem 1.5rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goalView === 'record' ? '#ea580c' : '#374151', color: 'white'}}>記録</button>
                <button onClick={() => setGoalView('dashboard')} style={{padding: '0.75rem 1.5rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goalView === 'dashboard' ? '#ea580c' : '#374151', color: 'white'}}>📊 分析</button>
              </div>

              {goalView === 'record' ? (
                <>
                  <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1rem', marginBottom: '1.5rem', border: '1px solid #374151', display: 'flex', alignItems: 'center', justifyContent: 'space-between'}}>
                    <button onClick={() => setSelectedGoalDate(changeDate(selectedGoalDate, -1))} style={{padding: '0.75rem', background: '#374151', borderRadius: '0.5rem', color: '#d1d5db', width: '48px', height: '48px'}}>←</button>
                    <p style={{fontSize: '1.25rem', fontWeight: 'bold', color: 'white', flex: 1, textAlign: 'center'}}>{formatDate(selectedGoalDate)}</p>
                    <button onClick={() => setSelectedGoalDate(changeDate(selectedGoalDate, 1))} style={{padding: '0.75rem', background: '#374151', borderRadius: '0.5rem', color: '#d1d5db', width: '48px', height: '48px'}}>→</button>
                  </div>

                  <div style={{display: 'flex', gap: '0.5rem', overflowX: 'auto', marginBottom: '1.5rem', paddingBottom: '0.5rem'}}>
                    <button onClick={() => setSelectedGoalTag('all')} style={{padding: '0.5rem 1rem', borderRadius: '0.5rem', whiteSpace: 'nowrap', background: selectedGoalTag === 'all' ? '#374151' : '#1f2937', color: 'white'}}>全て</button>
                    {tags.map(tag => <button key={tag} onClick={() => setSelectedGoalTag(tag)} style={{padding: '0.5rem 1rem', borderRadius: '0.5rem', whiteSpace: 'nowrap', background: selectedGoalTag === tag ? '#ea580c' : '#1f2937', color: 'white'}}>{tag}</button>)}
                  </div>

                  <div style={{display: 'flex', flexDirection: 'column', gap: '1rem', marginBottom: '1.5rem'}}>
                    {(selectedGoalTag === 'all' ? goals : goals.filter(g => g.tag === selectedGoalTag)).length === 0 ? (
                      <p style={{color: '#9ca3af', textAlign: 'center', padding: '2rem'}}>このカテゴリに目標がありません</p>
                    ) : (
                      (selectedGoalTag === 'all' ? goals : goals.filter(g => g.tag === selectedGoalTag)).map(goal => (
                        <div key={goal.id} style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1.5rem', border: '1px solid #374151'}}>
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem'}}>
                            <h3 style={{fontSize: '1.125rem', fontWeight: 'bold', color: 'white'}}>{goal.name}</h3>
                            <button onClick={() => deleteGoal(goal.id)} style={{background: 'transparent', color: '#ef4444', fontSize: '1.25rem'}}>✕</button>
                          </div>
                          <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.75rem'}}>
                            <button onClick={() => recordGoal(goal.id, 'min')} style={{padding: '0.75rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goal.records[selectedGoalDate] === 'min' ? '#ea580c' : '#374151', color: 'white', border: '1px solid ' + (goal.records[selectedGoalDate] === 'min' ? '#f97316' : '#4b5563')}}>MIN<br />{goal.min}</button>
                            <button onClick={() => recordGoal(goal.id, 'more')} style={{padding: '0.75rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goal.records[selectedGoalDate] === 'more' ? '#2563eb' : '#374151', color: 'white', border: '1px solid ' + (goal.records[selectedGoalDate] === 'more' ? '#3b82f6' : '#4b5563')}}>MORE<br />{goal.more}</button>
                            <button onClick={() => recordGoal(goal.id, 'max')} style={{padding: '0.75rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goal.records[selectedGoalDate] === 'max' ? '#16a34a' : '#374151', color: 'white', border: '1px solid ' + (goal.records[selectedGoalDate] === 'max' ? '#22c55e' : '#4b5563')}}>MAX<br />{goal.max}</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {!showGoalForm ? (
                    <button onClick={() => setShowGoalForm(true)} style={{width: '100%', background: '#374151', color: 'white', fontWeight: 'bold', padding: '0.75rem', borderRadius: '0.5rem', border: '1px solid #4b5563'}}>➕ 目標を追加</button>
                  ) : (
                    <div style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1.5rem', border: '1px solid #374151'}}>
                      <input type="text" placeholder="目標名" value={newGoalName} onChange={(e) => setNewGoalName(e.target.value)} style={{width: '100%', marginBottom: '0.75rem'}} />
                      {selectedGoalTag === 'all' && (
                        <select value={newGoalTag} onChange={(e) => setNewGoalTag(e.target.value)} style={{width: '100%', marginBottom: '0.75rem'}}>
                          <option value="">カテゴリを選択</option>
                          {tags.map(tag => <option key={tag} value={tag}>{tag}</option>)}
                        </select>
                      )}
                      <input type="text" placeholder="MIN" value={newGoalMin} onChange={(e) => setNewGoalMin(e.target.value)} style={{width: '100%', marginBottom: '0.75rem'}} />
                      <input type="text" placeholder="MORE" value={newGoalMore} onChange={(e) => setNewGoalMore(e.target.value)} style={{width: '100%', marginBottom: '0.75rem'}} />
                      <input type="text" placeholder="MAX" value={newGoalMax} onChange={(e) => setNewGoalMax(e.target.value)} style={{width: '100%', marginBottom: '0.75rem'}} />
                      <div style={{display: 'flex', gap: '0.5rem'}}>
                        <button onClick={addGoal} style={{flex: 1, background: '#ea580c', color: 'white', padding: '0.5rem'}}>追加</button>
                        <button onClick={() => setShowGoalForm(false)} style={{flex: 1, background: '#4b5563', color: 'white', padding: '0.5rem'}}>キャンセル</button>
                      </div>
                    </div>
                  )}
                </>
              ) : (
                <>
                  <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1.5rem'}}>
                    <button onClick={() => setGoalStatsPeriod('week')} style={{padding: '0.5rem 1.5rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goalStatsPeriod === 'week' ? '#ea580c' : '#374151', color: 'white'}}>過去7日間</button>
                    <button onClick={() => setGoalStatsPeriod('month')} style={{padding: '0.5rem 1.5rem', borderRadius: '0.5rem', fontWeight: 'bold', background: goalStatsPeriod === 'month' ? '#ea580c' : '#374151', color: 'white'}}>過去30日間</button>
                  </div>

                  {getGoalStatsForPeriod().length > 0 && (
                    <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                      {getGoalStatsForPeriod().map((stat, idx) => {
                        const totalDays = goalStatsPeriod === 'week' ? 7 : 30;
                        const maxDeg = (stat.maxCount / totalDays) * 360;
                        const moreDeg = (stat.moreCount / totalDays) * 360;
                        const minDeg = (stat.minCount / totalDays) * 360;
                        
                        return (
                          <div key={idx} style={{backgroundColor: '#1f2937', borderRadius: '0.5rem', padding: '1.5rem', border: '1px solid #374151'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem'}}>
                              <h3 style={{fontSize: '1.125rem', fontWeight: 'bold', color: 'white'}}>{stat.name}</h3>
                              <span style={{fontSize: '1.5rem', fontWeight: 'bold', color: '#fb923c'}}>{stat.achievement}%</span>
                            </div>
                            
                            <div style={{
                              width: '150px',
                              height: '150px',
                              borderRadius: '50%',
                              background: `conic-gradient(#4ade80 0deg ${maxDeg}deg, #60a5fa ${maxDeg}deg ${maxDeg + moreDeg}deg, #fb923c ${maxDeg + moreDeg}deg ${maxDeg + moreDeg + minDeg}deg, #4b5563 ${maxDeg + moreDeg + minDeg}deg 360deg)`,
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'center',
                              margin: '1rem auto'
                            }}>
                              <div style={{width: '120px', height: '120px', borderRadius: '50%', backgroundColor: '#1f2937', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 'bold', fontSize: '1.25rem'}}>
                                {stat.achievement}%
                              </div>
                            </div>
                            
                            <div style={{display: 'flex', flexDirection: 'column', gap: '0.5rem'}}>
                              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                                <div style={{width: '12px', height: '12px', borderRadius: '2px', backgroundColor: '#4ade80'}}></div>
                                <span style={{fontSize: '0.875rem', color: '#9ca3af'}}>MAX: {stat.maxCount}日</span>
                              </div>
                              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                                <div style={{width: '12px', height: '12px', borderRadius: '2px', backgroundColor: '#60a5fa'}}></div>
                                <span style={{fontSize: '0.875rem', color: '#9ca3af'}}>MORE: {stat.moreCount}日</span>
                              </div>
                              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                                <div style={{width: '12px', height: '12px', borderRadius: '2px', backgroundColor: '#fb923c'}}></div>
                                <span style={{fontSize: '0.875rem', color: '#9ca3af'}}>MIN: {stat.minCount}日</span>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        );
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HabitTracker />);
  </script>
</body>
</html>
